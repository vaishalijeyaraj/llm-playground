<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LLM Playground</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#f0f0f0;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

    header{background:#111;padding:14px 24px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    header h1{font-size:18px;font-weight:800;color:#00d084;letter-spacing:-0.5px;}
    .badge{background:#1a1a1a;border:1px solid #2a2a2a;color:#888;font-size:11px;padding:4px 10px;border-radius:20px;}
    .header-right{display:flex;gap:8px;align-items:center;}

    .tabs{background:#111;padding:0 24px;border-bottom:1px solid #222;display:flex;flex-shrink:0;}
    .tab{padding:12px 20px;font-size:13px;font-weight:600;color:#555;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;}
    .tab:hover{color:#aaa;}
    .tab.active{color:#00d084;border-bottom-color:#00d084;}

    .controls{background:#111;padding:10px 24px;border-bottom:1px solid #222;display:flex;gap:16px;align-items:center;flex-wrap:wrap;flex-shrink:0;}
    .ctrl-group{display:flex;align-items:center;gap:8px;}
    .ctrl-group label{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:0.5px;}
    select{background:#1a1a1a;color:#f0f0f0;border:1px solid #2a2a2a;border-radius:6px;padding:5px 8px;font-size:12px;outline:none;cursor:pointer;}
    select:focus{border-color:#00d084;}
    input[type="range"]{accent-color:#00d084;}
    .temp-val{font-size:12px;color:#00d084;min-width:24px;}
    .system-prompt-row{width:100%;display:flex;align-items:center;gap:8px;}
    .system-prompt-row input{flex:1;background:#1a1a1a;color:#f0f0f0;border:1px solid #2a2a2a;border-radius:6px;padding:5px 10px;font-size:12px;outline:none;}
    .system-prompt-row input:focus{border-color:#00d084;}

    .templates{background:#0f0f0f;padding:8px 24px;border-bottom:1px solid #222;display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;align-items:center;}
    .pill{background:#1a1a1a;border:1px solid #2a2a2a;color:#888;font-size:11px;padding:4px 12px;border-radius:20px;cursor:pointer;transition:all 0.2s;}
    .pill:hover{border-color:#00d084;color:#00d084;}
    .pill.active{background:#00d08422;border-color:#00d084;color:#00d084;}

    .panel{display:none;flex:1;overflow:hidden;flex-direction:column;}
    .panel.active{display:flex;}

    #chat-box{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
    .message{max-width:72%;padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;}
    .user-message{background:#00d084;color:#000;align-self:flex-end;border-bottom-right-radius:2px;font-weight:500;}
    .ai-message{background:#161616;color:#e8e8e8;align-self:flex-start;border-bottom-left-radius:2px;border:1px solid #222;}
    .error-message{background:#2a1515;color:#ff6b6b;align-self:flex-start;border-bottom-left-radius:2px;border:1px solid #441111;}
    .msg-meta{font-size:10px;color:#444;margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .chip{font-size:10px;padding:2px 7px;border-radius:10px;}
    .token-chip{background:#1e1e1e;color:#00d084;}
    .time-chip{background:#1e1e1e;color:#888;}
    .typing{background:#161616;color:#555;align-self:flex-start;padding:12px 16px;border-radius:12px;font-size:13px;border:1px solid #222;}
    .typing span{animation:blink 1.2s infinite;}
    .typing span:nth-child(2){animation-delay:0.2s;}
    .typing span:nth-child(3){animation-delay:0.4s;}
    @keyframes blink{0%,100%{opacity:0.2;}50%{opacity:1;}}

    .input-area{background:#111;padding:14px 24px;border-top:1px solid #222;display:flex;gap:10px;flex-shrink:0;}
    textarea{flex:1;background:#1a1a1a;color:#f0f0f0;border:1px solid #2a2a2a;border-radius:10px;padding:10px 14px;font-size:13px;resize:none;outline:none;font-family:inherit;line-height:1.5;}
    textarea:focus{border-color:#00d084;}
    .btn{border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
    .btn-primary{background:#00d084;color:#000;}
    .btn-primary:hover{opacity:0.85;}
    .btn-secondary{background:#1a1a1a;color:#555;border:1px solid #2a2a2a;font-weight:500;}
    .btn-secondary:hover{color:#aaa;border-color:#444;}
    .btn-danger{background:#1a1a1a;color:#555;border:1px solid #2a2a2a;font-weight:500;}
    .btn-danger:hover{color:#ff6b6b;border-color:#ff6b6b;}

    /* COMPARE PANEL */
    #compare-panel{flex:1;display:none;flex-direction:column;overflow:hidden;}
    #compare-panel.active{display:flex;}
    .compare-toolbar{padding:12px 24px;border-bottom:1px solid #222;background:#0f0f0f;display:flex;align-items:center;gap:12px;flex-shrink:0;}
    .compare-toolbar span{font-size:12px;color:#555;}
    .btn-add{background:#00d08422;border:1px solid #00d084;color:#00d084;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;}
    .btn-add:hover{background:#00d08444;}
    .compare-grid{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;gap:1px;background:#222;}
    .compare-col{background:#0a0a0a;display:flex;flex-direction:column;min-width:300px;flex:1;overflow:hidden;}
    .compare-col-header{padding:10px 14px;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px;}
    .compare-col-header select{flex:1;font-size:11px;}
    .btn-remove{background:none;border:none;color:#333;font-size:16px;cursor:pointer;padding:0 4px;transition:color 0.2s;font-weight:700;}
    .btn-remove:hover{color:#ff6b6b;}
    .compare-body{flex:1;overflow-y:auto;padding:14px;}
    .compare-result{background:#161616;border:1px solid #222;border-radius:10px;padding:14px;font-size:13px;line-height:1.7;white-space:pre-wrap;color:#e8e8e8;min-height:80px;}
    .compare-result.empty{color:#333;font-style:italic;}
    .compare-result.error{background:#2a1515;color:#ff6b6b;border-color:#441111;}
    .compare-meta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
    .compare-input-area{padding:14px 24px;border-top:1px solid #222;display:flex;gap:10px;background:#111;flex-shrink:0;}
    .model-loading{font-size:11px;color:#555;font-style:italic;}

    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:4px;}

    .ai-message h1, .ai-message h2, .ai-message h3 {
  font-size: 13px;
  font-weight: 700;
  color: #00d084;
  margin: 8px 0 4px 0;
}
.ai-message p { margin: 4px 0; }
.ai-message ul, .ai-message ol {
  padding-left: 16px;
  margin: 4px 0;
}
.ai-message li { margin: 2px 0; }
.ai-message table {
  border-collapse: collapse;
  width: 100%;
  margin: 8px 0;
  font-size: 12px;
}
.ai-message th, .ai-message td {
  border: 1px solid #2a2a2a;
  padding: 6px 10px;
  text-align: left;
}
.ai-message th { background: #1e1e1e; color: #00d084; }
.ai-message code {
  background: #1e1e1e;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
}
.ai-message strong { color: #f0f0f0; }
  </style>
</head>
<body>

<header>
  <h1>⚡ LLM Playground</h1>
  <div class="header-right">
    <span class="badge" id="model-status">Loading models...</span>
    <span class="badge">Groq API</span>
    <span class="badge">Python + Flask</span>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('chat')">💬 Chat</div>
  <div class="tab" onclick="switchTab('compare')">⚖️ Compare Models</div>
</div>

<div class="controls">
  <div class="ctrl-group">
    <label>Model</label>
    <select id="model-select">
      <option value="">Loading...</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label>Temperature</label>
    <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.7"/>
    <span class="temp-val" id="temp-value">0.7</span>
  </div>
  <div class="system-prompt-row">
    <label style="font-size:11px;color:#555;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;">System Prompt</label>
    <input type="text" id="system-prompt" value="You are a helpful assistant."/>
  </div>
</div>

<div class="templates">
  <span style="font-size:11px;color:#444;">Quick Modes:</span>
  <div class="pill active" data-key="default" onclick="setTemplate('default',this)">🤖 Default</div>
  <div class="pill" data-key="analyst" onclick="setTemplate('analyst',this)">📊 Financial Analyst</div>
  <div class="pill" data-key="sentiment" onclick="setTemplate('sentiment',this)">📈 Sentiment Analysis</div>
  <div class="pill" data-key="earnings" onclick="setTemplate('earnings',this)">📋 Earnings Summarizer</div>
  <div class="pill" data-key="risk" onclick="setTemplate('risk',this)">⚠️ Risk Assessment</div>
  <div class="pill" data-key="trader" onclick="setTemplate('trader',this)">💰 Trader Mode</div>
</div>

<!-- CHAT PANEL -->
<div class="panel active" id="chat-panel">
  <div id="chat-box"></div>
  <div class="input-area">
    <textarea id="user-input" rows="2" placeholder="Type your message... (Enter to send, Shift+Enter for new line)"></textarea>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <button class="btn btn-primary" onclick="sendMessage()">Send ↑</button>
      <button class="btn btn-secondary" onclick="exportChat()">Export</button>
      <button class="btn btn-danger" onclick="clearChat()">Clear</button>
    </div>
  </div>
</div>

<!-- COMPARE PANEL -->
<div id="compare-panel">
  <div class="compare-toolbar">
    <span id="compare-status">Select models and type a prompt to compare</span>
    <button class="btn-add" onclick="addCompareColumn()">+ Add Model</button>
  </div>
  <div class="compare-grid" id="compare-grid"></div>
  <div class="compare-input-area">
    <textarea id="compare-input" rows="2" placeholder="Type a prompt to send to all models simultaneously... (Enter to send)"></textarea>
    <button class="btn btn-primary" onclick="runComparison()">Compare ↑</button>
  </div>
</div>

<script>
const TEMPLATES = {
  default: "You are a helpful assistant.",
  analyst: "You are a senior Wall Street financial analyst with 20 years experience. You speak in sharp, confident, data-driven sentences. You always mention risks alongside opportunities. If the question is not related to finance or investment, politely decline and redirect the user to ask a finance-related question.",
  sentiment: "You are a financial sentiment analysis engine. When given any financial text, news, or earnings data, you respond with: SENTIMENT (Bullish/Bearish/Neutral), CONFIDENCE (0-100%), KEY SIGNALS (bullet points), and TRADING IMPLICATION. Be precise and clinical. If the input is not related to finance, politely decline and ask for financial text to analyze.",
  earnings: "You are an expert at analyzing earnings call transcripts. Extract and summarize: Revenue highlights, EPS vs expectations, Forward guidance, Management tone, Key risks mentioned, and One-line verdict. Use bullet points. If the input is not an earnings-related text, politely decline and ask for earnings or financial content.",
  risk: "You are a quantitative risk assessment AI. When given a portfolio, stock, or financial scenario, analyze: Market Risk, Liquidity Risk, Concentration Risk, Macro Risk, and give an overall Risk Score (1-10). Be specific and quantitative. If the question is not related to finance or portfolio analysis, politely decline and redirect.",
  trader: "You are an aggressive Wall Street trader. Short sentences. High conviction. No fluff. Always give a clear BUY, SELL, or HOLD with a one-line reason. If the question is not about a financial instrument or market, decline and ask for a finance-related question."
};

let availableModels = [];
let chatLog = [];
let columnCount = 0;

// Load models on startup
async function loadModels() {
  try {
    const res = await fetch('/models');
    const data = await res.json();
    availableModels = data.models;

    // Populate chat model selector
    const chatSelect = document.getElementById('model-select');
    chatSelect.innerHTML = availableModels.map(m =>
      `<option value="${m.id}">${m.id}</option>`
    ).join('');

    const status = document.getElementById('model-status');
    if (data.source === 'live') {
      status.textContent = `${availableModels.length} models live`;
      status.style.color = '#00d084';
    } else if (data.source === 'fresh') {
      status.textContent = `${availableModels.length} models (fresh cache)`;
      status.style.color = '#00d084';
    } else if (data.source === 'acceptable') {
      status.textContent = `${availableModels.length} models (cached)`;
      status.style.color = '#ff9900';
    } else if (data.source === 'stale') {
      status.textContent = `${availableModels.length} models (stale cache)`;
      status.style.color = '#ff6600';
    } else {
      status.textContent = 'Emergency fallback models';
      status.style.color = '#ff4444';
    }

    // Init compare with 2 columns
    addCompareColumn();
    addCompareColumn();

  } catch(e) {
    document.getElementById('model-status').textContent = 'Model load failed';
  }
}

function addCompareColumn() {
  columnCount++;
  const col = document.createElement('div');
  col.className = 'compare-col';
  col.id = `col-${columnCount}`;

  const modelOptions = availableModels.map(m =>
    `<option value="${m.id}">${m.id}</option>`
  ).join('');

  col.innerHTML = `
    <div class="compare-col-header">
      <select id="sel-${columnCount}" onchange="updateColLabel(${columnCount})">
        ${modelOptions || '<option value="">Loading...</option>'}
      </select>
      <button class="btn-remove" onclick="removeColumn(${columnCount})" title="Remove">✕</button>
    </div>
    <div class="compare-body">
      <div class="compare-result empty" id="result-${columnCount}">Response will appear here...</div>
      <div class="compare-meta" id="meta-${columnCount}"></div>
    </div>
  `;

  // Set different default model for each column
  document.getElementById('compare-grid').appendChild(col);
  if (availableModels.length >= columnCount) {
    const sel = document.getElementById(`sel-${columnCount}`);
    if (sel) sel.selectedIndex = Math.min(columnCount - 1, availableModels.length - 1);
  }
}

function removeColumn(id) {
  const col = document.getElementById(`col-${id}`);
  const grid = document.getElementById('compare-grid');
  if (grid.children.length <= 1) {
    alert('You need at least one model column.');
    return;
  }
  if (col) col.remove();
}

// Temperature slider
document.getElementById('temperature').addEventListener('input', function() {
  document.getElementById('temp-value').textContent = this.value;
});

// Enter to send
document.getElementById('user-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('compare-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); runComparison(); }
});

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('chat-panel').classList.remove('active');
  document.getElementById('compare-panel').classList.remove('active');
  if (tab === 'chat') {
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('chat-panel').classList.add('active');
  } else {
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('compare-panel').classList.add('active');
  }
}

function setTemplate(key, el) {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('system-prompt').value = TEMPLATES[key];
}

function addMessage(text, type, meta={}) {
  const chatBox = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = `message ${type}`;

  // Render markdown safely for AI messages
  if (type === 'ai-message') {
    div.innerHTML = DOMPurify.sanitize(marked.parse(text));
  } else {
    div.textContent = text;
  }

  if (meta.model) {
    const metaDiv = document.createElement('div');
    metaDiv.className = 'msg-meta';
    let dataTag = '';
    if (meta.data_notice && meta.data_notice.startsWith('ticker:')) {
      const ticker = meta.data_notice.split(':')[1];
      dataTag = `<span class="chip" style="background:#1a2a1a;color:#00d084;border:1px solid #00d08444;">📊 live data: ${ticker}</span>`;
    } else if (meta.data_notice && meta.data_notice.startsWith('fetch_failed:')) {
      const ticker = meta.data_notice.split(':')[1];
      dataTag = `<span class="chip" style="background:#2a1a1a;color:#ff6b6b;border:1px solid #ff6b6b44;">⚠️ data unavailable: ${ticker}</span>`;
    }
    metaDiv.innerHTML = `🤖 ${meta.model} <span class="chip token-chip">${meta.tokens} tokens</span><span class="chip time-chip">${meta.time}s</span>${dataTag}`;
    div.appendChild(metaDiv);
  }
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const message = input.value.trim();
  if (!message) return;

  const model = document.getElementById('model-select').value;
  const temperature = document.getElementById('temperature').value;
  const systemPrompt = document.getElementById('system-prompt').value;

  addMessage(message, 'user-message');
  chatLog.push({role:'user', content:message});
  input.value = '';

  const chatBox = document.getElementById('chat-box');
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span>●</span><span>●</span><span>●</span>';
  chatBox.appendChild(typing);
  chatBox.scrollTop = chatBox.scrollHeight;

  try {
    const response = await fetch('/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
      message,
      model,
      temperature,
      system_prompt: systemPrompt,
      persona_key: document.querySelector('.pill.active')?.getAttribute('data-key') || 'default'
      })
    });
    const data = await response.json();
    typing.remove();

    if (data.success) {
      addMessage(data.reply, 'ai-message', {
        model: data.model,
        tokens: data.tokens,
        time: data.time,
        data_notice: data.data_notice
      });
      chatLog.push({role:'assistant', content: data.reply, model: data.model});
    } else {
      addMessage(data.error, 'error-message');
    }
  } catch(err) {
    typing.remove();
    addMessage('Could not reach the server. Check that app.py is running.', 'error-message');
  }
}

async function runComparison() {
  const input = document.getElementById('compare-input');
  const message = input.value.trim();
  if (!message) return;

  const temperature = document.getElementById('temperature').value;
  const systemPrompt = document.getElementById('system-prompt').value;

  // Collect all selected models from all columns
  const grid = document.getElementById('compare-grid');
  const columns = grid.querySelectorAll('.compare-col');
  const models = [];
  const colIds = [];

  columns.forEach(col => {
    const id = col.id.replace('col-', '');
    const sel = document.getElementById(`sel-${id}`);
    if (sel && sel.value) {
      models.push(sel.value);
      colIds.push(id);
    }
  });

  if (models.length === 0) {
    alert('Please select at least one model.');
    return;
  }

  // Set all columns to loading state
  colIds.forEach(id => {
    document.getElementById(`result-${id}`).textContent = 'Thinking...';
    document.getElementById(`result-${id}`).className = 'compare-result empty';
    document.getElementById(`meta-${id}`).innerHTML = '';
  });

  document.getElementById('compare-status').textContent = `Comparing ${models.length} model${models.length > 1 ? 's' : ''} in parallel...`;

  try {
    const response = await fetch('/compare', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message, models, temperature, system_prompt: systemPrompt})
    });
    const data = await response.json();

    colIds.forEach((id, i) => {
      const model = models[i];
      const result = data.results[model];
      const resultEl = document.getElementById(`result-${id}`);
      const metaEl = document.getElementById(`meta-${id}`);

      if (result && result.success) {
        resultEl.textContent = result.reply;
        resultEl.className = 'compare-result';
        metaEl.innerHTML = `<span class="chip token-chip">${result.tokens} tokens</span><span class="chip time-chip">${result.time}s</span>`;
      } else {
        resultEl.textContent = result ? result.error : 'No response received.';
        resultEl.className = 'compare-result error';
      }
    });

    document.getElementById('compare-status').textContent = `${models.length} model${models.length > 1 ? 's' : ''} responded`;

  } catch(err) {
    colIds.forEach(id => {
      document.getElementById(`result-${id}`).textContent = 'Could not reach the server.';
      document.getElementById(`result-${id}`).className = 'compare-result error';
    });
  }
}

function exportChat() {
  if (chatLog.length === 0) { alert('No chat to export yet!'); return; }
  let text = '=== LLM Playground Chat Export ===\n\n';
  chatLog.forEach(msg => {
    const role = msg.role === 'user' ? 'YOU' : `AI (${msg.model || 'assistant'})`;
    text += `[${role}]\n${msg.content}\n\n`;
  });
  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'chat-export.txt';
  a.click();
}

async function clearChat() {
  await fetch('/clear', {method:'POST'});
  document.getElementById('chat-box').innerHTML = '';
  chatLog = [];
}

// Load models when page opens
loadModels();
</script>
</body>
</html>
